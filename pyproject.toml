[project]
name = "mcp-bridge-template"
version = "0.1.0"
description = "A small notes service and an authenticated MCP bridge"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.17.0"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
